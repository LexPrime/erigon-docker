x-logging:
  &logging
  logging:
    options:
      max-size: 50m
      max-file: "3"

services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: always
    env_file:
      - .env
    ports:
      - "443:443"
    command:
      - "--api=true"
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--log.level=DEBUG"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.websecure.address=:443"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=$EMAIL"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    volumes:
      - "traefik_letsencrypt:/letsencrypt"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    <<: *logging
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.ipallowlist.ipallowlist.sourcerange=$WHITELIST"

      - "traefik.http.routers.metrics.rule=Host(`$DOMAIN`) && PathPrefix(`/metrics`)"
      - "traefik.http.services.metrics.loadbalancer.server.port=8082"
      - "traefik.http.routers.metrics.entrypoints=websecure"
      - "traefik.http.routers.metrics.tls.certresolver=myresolver"
      - "traefik.http.routers.metrics.middlewares=ipallowlist"


  erigon-hz8:
    image: erigontech/erigon:$ERIGON_VERSION
    user: root
    restart: unless-stopped
    container_name: erigon
    stop_grace_period: 3m
    env_file:
      - .env
    expose:
      - 8545
      - 8551
      - 6060
      - 9090
      - 5555
    ports:
      - 30303:30303
      - 30304:30304
      - 42069:42069
      - 4000:4000
      - 4001:4001
    volumes:
      - ./data:/root/.local/share/erigon
      - ./data/jwt.hex:/root/.local/share/erigon/jwt.hex:ro
    command: |
      --chain=mainnet
      --prune.mode=archive
      --authrpc.jwtsecret=/root/.local/share/erigon/jwt.hex
      --authrpc.addr=0.0.0.0
      --beacon.api=beacon
      --beacon.api.addr=0.0.0.0
      --authrpc.vhosts=*
      --db.size.limit=8TB
      --db.pagesize=16kb
      --http.addr=0.0.0.0
      --http.vhosts=*
      --http.corsdomain=*
      --http.api=eth,debug,web3,erigon,trace,net,txpool
      --private.api.addr=0.0.0.0:9090
      --metrics
      --metrics.addr=0.0.0.0
      --ws
      --torrent.download.rate=1024mb
      --rpc.returndata.limit=1000000
      --sync.loop.block.limit=10_000
      --batchSize=2g
    <<: *logging
    labels:
    - "traefik.enable=true"
    - "traefik.http.services.erigon.loadbalancer.server.port=8545"
    - "traefik.http.routers.erigon.entrypoints=websecure"
    - "traefik.http.routers.erigon.tls.certresolver=myresolver"
    - "traefik.http.routers.erigon.rule=Host(`$DOMAIN`)"
    - "traefik.http.routers.erigon.middlewares=ipallowlist"

volumes:
  traefik_letsencrypt:
